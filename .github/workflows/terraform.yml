# GitOps for GitHub App access: plan on every pull request, apply on merge to main.
# Credentials and gates: docs/decisions.md (D-002 local execution, D-005 tokens, D-007 plan approval, D-009 approvals).
name: terraform

on:
  pull_request: # no `paths` filter: validate and plan are required checks, so they must always report
  push:
    branches: [main]
  workflow_dispatch: # re-run an apply on main by hand

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.16.6"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
  TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
  TF_VAR_github_owner: ${{ vars.GH_OWNER || github.repository_owner }}
  TF_VAR_app_slug_prefix: ${{ vars.APP_SLUG_PREFIX }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Forks get no secrets, so their plan can't run. A skipped plan must not count as a passing required check.
      - name: Refuse pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Pull requests from forks are not planned. A maintainer can push the branch to this repository instead."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Init (no backend, no credentials)
        working-directory: terraform
        run: terraform init -backend=false -lockfile=readonly

      - name: Validate
        working-directory: terraform
        run: terraform validate

      - name: Test (mocked provider, offline)
        working-directory: terraform
        run: terraform test

      - name: Flag risky HCL for the plan approver
        run: scripts/risky-hcl.sh

  plan:
    name: plan
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required reviewer: `terraform plan` executes this PR's code with the credentials below (D-007).
    environment: plan
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Plan
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }} # state only (D-002)
          GITHUB_TOKEN: ${{ secrets.GH_TF_TOKEN }} # classic PAT read by the provider (D-005)
        run: scripts/tf-plan.sh

      - name: Plan guard (D-006)
        run: |
          set -o pipefail
          scripts/plan-guard.sh terraform/plan.json 2>&1 | tee guard.log

      - name: Comment on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            scripts/plan-report.sh guard.log
            echo
            echo "<sub>Plan for ${HEAD_SHA:0:7} · [workflow run]($RUN_URL) · approve the \`plan\` environment to re-run after a push</sub>"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          scripts/pr-comment.sh "$PR" report.md terraform-plan

  apply:
    name: apply
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deployment branch policy: main only, so pull-request runs can never reach these secrets.
    environment: production
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    steps:
      # Reconcile the LATEST main, not the commit that triggered this run. GitHub can deliver push events late. On
      # 2026-10-21 a delayed run for an older commit re-applied stale state; see NOTES.md. Applies are serialized,
      # so each one makes GitHub match main as it is now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Re-plan from main rather than reuse the PR's plan: branches must be up to date before merging, and saved
      # plan artifacts would be public on a public repo.
      - name: Plan
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
          GITHUB_TOKEN: ${{ secrets.GH_TF_TOKEN }}
        run: scripts/tf-plan.sh

      - name: Plan guard (D-006)
        run: |
          set -o pipefail
          scripts/plan-guard.sh terraform/plan.json 2>&1 | tee guard.log

      - name: Apply
        id: apply
        working-directory: terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
          GITHUB_TOKEN: ${{ secrets.GH_TF_TOKEN }}
        run: |
          set -o pipefail
          terraform apply -no-color tfplan 2>&1 | tee apply.log

      - name: Report on the merged pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.apply.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          applied="$(git rev-parse --short HEAD)"
          {
            case "$OUTCOME" in
              success) echo "## ✅ Applied \`main\` @ $applied to \`$TF_VAR_github_owner\`" ;;
              skipped) echo "## ⏸️ Not applied (plan or guard failed)" ;;
              *)       echo "## ❌ Apply failed"; echo; echo '```'; tail -c 15000 terraform/apply.log 2>/dev/null; echo '```' ;;
            esac
            if [ "$applied" != "${GITHUB_SHA:0:7}" ]; then
              echo
              echo "Triggered by ${GITHUB_SHA:0:7}, but \`main\` had moved on to $applied, so the latest desired state was applied."
            fi
            echo
            scripts/plan-report.sh guard.log
            echo
            echo "<sub>main @ $applied · [workflow run]($RUN_URL)</sub>"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then scripts/pr-comment.sh "$pr" report.md terraform-apply; fi
